name: Workbench verification
on:
  push:
    branches: [fix/vivari-workbench-expo-chatgpt]
  pull_request:
    paths: ['src/**', 'convex/**', 'tests/**', 'scripts/**', 'package*.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://acoustic-yak-317.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
